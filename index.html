<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Summary — Claude AI Usage Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script>window.CURRENT_PAGE = 'summary';</script>
  <script src="nav.js"></script>
  <script src="charts.js"></script>
  <script src="export.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
      body { background: #020617 !important; }
      #nav-root, #mobile-menu-toggle, #mobile-overlay { display: none !important; }
      main { margin-left: 0 !important; }
      [data-hide-pdf] { display: none !important; }
      [data-show-pdf] { display: flex !important; }
      .bg-slate-900 { background-color: #0f172a !important; }
      .bg-slate-950 { background-color: #020617 !important; }
      .border-slate-800 { border-color: #1e293b !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen antialiased">
  <div id="nav-root"></div>
  <main class="ml-0 lg:ml-[260px] min-h-screen">
    <div id="export-content" class="max-w-[1280px] mx-auto px-6 py-8 pt-14 lg:pt-8">
      <!-- Content rendered by JS -->
    </div>
  </main>

  <script>
    let summaryView = 'tokens';

    function renderSummary() {
      const container = document.getElementById('export-content');
      const month = DATA.currentMonth;
      const summary = month.summary;
      const topCostUser = month.computed.costRanking[0];
      const topTokenUser = [...month.activeMembers].sort((a, b) => b.totalTokens - a.totalTokens)[0];

      // Helper: append * to names with partial data
      const displayName = (m) => m.note ? m.short + ' *' : m.short;

      // Cost distribution
      const costDistribution = month.activeMembers.map(m => ({
        label: displayName(m), value: m.totalCost, color: m.color,
      })).sort((a, b) => b.value - a.value);

      // Token distribution
      const tokenDistribution = month.activeMembers.map(m => ({
        label: displayName(m), value: m.totalTokens, color: m.color,
      })).sort((a, b) => b.value - a.value);

      // View-specific data
      const isCost = summaryView === 'cost';
      const donutData = isCost ? costDistribution : tokenDistribution;
      const donutTitle = isCost ? 'Cost Distribution' : 'Token Distribution';

      const insights = isCost ? [
        `${topCostUser.short} leads spend at ${Theme.formatCost(topCostUser.totalCost)} (${Theme.formatPercent(topCostUser.totalCost / summary.totalCost * 100)} of total)`,
        `Team average: ${Theme.formatCost(summary.avgCostPerActiveDay)} per active day`,
        `Average cost per person: ${Theme.formatCost(summary.avgCostPerPerson)}`,
        `${Theme.formatPercent(month.computed.teamAdoptionRate)} team adoption rate across ${summary.teamSize} members`,
        `${summary.totalProjects} unique projects tracked`,
      ] : [
        `${topTokenUser.short} leads token usage at ${Theme.formatTokens(topTokenUser.totalTokens)} (${Theme.formatPercent(topTokenUser.totalTokens / summary.totalTokens * 100)} of total)`,
        `Total input tokens: ${Theme.formatTokens(summary.totalInputTokens)} — total output: ${Theme.formatTokens(summary.totalOutputTokens)}`,
        `Output/input ratio: ${(summary.totalOutputTokens / summary.totalInputTokens).toFixed(2)}x across the team`,
        `Average tokens per person: ${Theme.formatTokens(Math.round(summary.totalTokens / summary.teamSize))}`,
        `Average tokens per active day: ${Theme.formatTokens(Math.round(summary.totalTokens / summary.totalActiveDays))}`,
      ];

      // Activity bar — switch between active days and token usage
      const activityData = isCost
        ? month.computed.activityRanking.map(m => {
            const member = month.activeMembers.find(a => a.id === m.id);
            return { name: displayName(member || m), value: m.activeDays, color: m.color, displayValue: `${m.activeDays} days` };
          })
        : [...month.activeMembers].sort((a, b) => b.totalTokens - a.totalTokens).map(m => ({
            name: displayName(m), value: m.totalTokens, color: m.color,
            displayValue: Theme.formatTokens(m.totalTokens),
          }));

      const activityTitle = isCost ? 'Team Activity' : 'Token Usage by Member';
      const activityMax = isCost ? 25 : undefined;

      const toggleBtn = (label, value) => {
        const active = summaryView === value;
        return `<button onclick="summaryView='${value}';renderSummary()"
          class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors ${active ? 'bg-slate-700 text-slate-100 border border-slate-600' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-300'}">
          ${label}
        </button>`;
      };

      container.innerHTML = `
        ${Theme.pageHeader('Executive Summary', DATA.meta.organization + ' — ' + DATA.meta.team)}

        <p class="text-xs text-slate-600 -mt-6 mb-6 font-mono">Last updated: ${new Date(DATA.meta.generatedDate + 'T00:00:00+05:30').toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Colombo' })} IST</p>

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          ${Theme.statCard('Total Cost', Theme.formatCost(summary.totalCost), month.label)}
          ${Theme.statCard('Total Tokens', Theme.formatTokens(summary.totalTokens), Theme.formatTokens(summary.totalInputTokens) + ' in / ' + Theme.formatTokens(summary.totalOutputTokens) + ' out')}
          ${Theme.statCard('Team Size', summary.teamSize + ' Members', summary.pendingCount + ' pending')}
          ${Theme.statCard('Total Active Days', Theme.formatNumber(summary.totalActiveDays), 'Across all members')}
        </div>

        <!-- View Toggle -->
        <div class="flex items-center gap-2 mb-6" data-hide-pdf>
          <span class="text-xs text-slate-500 uppercase tracking-wider mr-2">View:</span>
          ${toggleBtn('Tokens', 'tokens')}
          ${toggleBtn('Cost', 'cost')}
        </div>

        <!-- 2-Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
          <!-- Distribution Donut -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-6">
            <h2 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">${donutTitle}</h2>
            ${Charts.donut(donutData, 180, isCost ? Theme.formatCost : Theme.formatTokens, false)}
          </div>

          <!-- Key Insights -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-6">
            <h2 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">Key Insights</h2>
            <div class="space-y-4">
              ${insights.map(insight => `
                <div class="flex items-start gap-3">
                  <svg class="w-5 h-5 text-green-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <p class="text-sm text-slate-300">${insight}</p>
                </div>
              `).join('')}
              ${month.pendingMembers.length > 0 ? `
                <div class="flex items-start gap-3 pt-4 border-t border-slate-800">
                  <svg class="w-5 h-5 text-yellow-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <p class="text-sm text-slate-400">Pending reports: ${month.pendingMembers.map(m => m.short).join(', ')}</p>
                </div>
              ` : ''}
              ${month.activeMembers.filter(m => m.note).map(m => `
                <div class="flex items-start gap-3 pt-4 border-t border-slate-800">
                  <span class="text-amber-400 font-bold flex-shrink-0 mt-0.5 text-sm">*</span>
                  <p class="text-sm text-amber-300">${Theme.escapeHtml(m.short)}: ${Theme.escapeHtml(m.note)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- Team Activity / Token Usage -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-6">
          <h2 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">${activityTitle}</h2>
          <div class="space-y-1">
            ${Charts.horizontalBar(activityData, activityMax)}
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderSummary);
  </script>
</body>
</html>
