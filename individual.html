<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Individual Detail — Claude AI Usage Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script>window.CURRENT_PAGE = 'individual';</script>
  <script src="nav.js"></script>
  <script src="charts.js"></script>
  <script src="export.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen antialiased">
  <div id="nav-root"></div>
  <main class="ml-0 lg:ml-[260px] min-h-screen">
    <div id="export-content" class="max-w-[1280px] mx-auto px-6 py-8 pt-14 lg:pt-8">
      <!-- Content rendered by JS -->
    </div>
  </main>

  <script>
    function getSelectedMemberId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        const member = DATA.currentMonth.activeMembers.find(m => m.id === id);
        if (member) return id;
      }
      // Default to highest cost member
      return DATA.currentMonth.computed.costRanking[0].id;
    }

    function selectMember(id) {
      const url = new URL(window.location);
      url.searchParams.set('id', id);
      window.history.pushState({}, '', url);
      renderIndividualDetail();
    }

    function renderIndividualDetail() {
      const container = document.getElementById('export-content');
      const month = DATA.currentMonth;
      const selectedId = getSelectedMemberId();
      const member = month.activeMembers.find(m => m.id === selectedId);

      if (!member) {
        container.innerHTML = '<p class="text-slate-500">Member not found</p>';
        return;
      }

      const costPerDay = member.activeDays > 0 ? member.totalCost / member.activeDays : 0;
      const adoptionRate = (member.activeDays / month.workingDays) * 100;

      // Token split for donut
      const tokenSplit = [
        { label: 'Input Tokens', value: member.inputTokens, color: '#22c55e', displayValue: Theme.formatTokens(member.inputTokens) },
        { label: 'Output Tokens', value: member.outputTokens, color: '#a855f7', displayValue: Theme.formatTokens(member.outputTokens) },
      ];

      container.innerHTML = `
        ${Theme.pageHeader('Individual Breakdown', 'Detailed usage analysis by team member')}

        <!-- Person Selector Pills -->
        <div class="flex items-center gap-2 mb-6 overflow-x-auto pb-2">
          ${month.activeMembers.map(m => `
            <button onclick="selectMember('${m.id}')"
              class="px-4 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap ${m.id === selectedId ? 'text-white border-2' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-300'}"
              style="${m.id === selectedId ? `background:${m.color};border-color:${m.color}` : ''}">
              ${Theme.escapeHtml(m.short)}
            </button>
          `).join('')}
        </div>

        <!-- Header Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 mb-6">
          <div class="flex items-center gap-4">
            <div class="w-20 h-20 rounded-full flex items-center justify-center text-white font-semibold text-2xl flex-shrink-0" style="background:${member.color}">
              ${Theme.initials(member.name)}
            </div>
            <div class="flex-1">
              <h2 class="text-xl font-semibold text-slate-100">${Theme.escapeHtml(member.name)}</h2>
              <p class="text-sm text-slate-400 mt-1">${Theme.escapeHtml(member.role)}</p>
              ${member.pdfFile ? `
                <a href="${member.pdfFile}" target="_blank" class="inline-flex items-center gap-2 mt-3 px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-xs text-slate-300 hover:bg-slate-700 hover:border-slate-600 transition-colors">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                  View Full ClaudeScope Report
                </a>
              ` : ''}
            </div>
          </div>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          ${Theme.statCard('Total Cost', Theme.formatCost(member.totalCost), Theme.formatCost(costPerDay) + ' per day')}
          ${Theme.statCard('Total Tokens', Theme.formatTokens(member.totalTokens), 'Input + Output')}
          ${Theme.statCard('Active Days', member.activeDays + ' days', Theme.formatPercent(adoptionRate) + ' adoption')}
          ${Theme.statCard('Projects', member.projects, member.sessions.length + ' sessions')}
        </div>

        <!-- 2-Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
          <!-- Token Split -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-6">
            <h3 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">Token Distribution</h3>
            ${Charts.donut(tokenSplit, 160)}
          </div>

          <!-- Quick Stats -->
          <div class="bg-slate-900 border border-slate-800 rounded-lg p-6">
            <h3 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">Quick Stats</h3>
            <div class="space-y-4">
              <div class="flex items-center justify-between py-3 border-b border-slate-800">
                <span class="text-sm text-slate-400">Cost Per Day</span>
                <span class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatCost(costPerDay)}</span>
              </div>
              <div class="flex items-center justify-between py-3 border-b border-slate-800">
                <span class="text-sm text-slate-400">Adoption Rate</span>
                <span class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatPercent(adoptionRate)}</span>
              </div>
              <div class="flex items-center justify-between py-3 border-b border-slate-800">
                <span class="text-sm text-slate-400">Token Efficiency</span>
                <span class="text-sm font-semibold text-slate-100 font-mono">${(member.outputTokens / member.inputTokens).toFixed(2)}x</span>
              </div>
              <div class="flex items-center justify-between py-3">
                <span class="text-sm text-slate-400">Avg Cost/Session</span>
                <span class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatCost(member.totalCost / member.sessions.length)}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Sessions Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-800">
            <h3 class="text-sm font-semibold text-slate-100 uppercase tracking-wider">Sessions Breakdown</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="border-b border-slate-800 bg-slate-950">
                  <th class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-3">Session Name</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-3">Cost</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-3">Tokens</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-3">Input</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-3">Output</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-6 py-3">Days</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${member.sessions.map(s => `
                  <tr class="hover:bg-slate-800/50 transition-colors">
                    <td class="px-6 py-3 text-sm text-slate-300">${Theme.escapeHtml(s.name)}</td>
                    <td class="px-6 py-3 text-right text-sm font-mono text-slate-300">${Theme.formatCost(s.cost)}</td>
                    <td class="px-6 py-3 text-right text-sm font-mono text-slate-300">${Theme.formatTokens(s.totalTokens)}</td>
                    <td class="px-6 py-3 text-right text-sm font-mono text-green-400">${Theme.formatTokens(s.inputTokens)}</td>
                    <td class="px-6 py-3 text-right text-sm font-mono text-purple-400">${Theme.formatTokens(s.outputTokens)}</td>
                    <td class="px-6 py-3 text-right text-sm font-mono text-slate-300">${s.days}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderIndividualDetail);
  </script>
</body>
</html>
