<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoption Metrics — Claude AI Usage Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script>window.CURRENT_PAGE = 'adoption';</script>
  <script src="nav.js"></script>
  <script src="charts.js"></script>
  <script src="export.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .export-mode #nav-root { display: none !important; }
    .export-mode main { margin-left: 0 !important; }
    .export-mode [data-hide-pdf] { display: none !important; }
    .export-mode [data-show-pdf] { display: flex !important; }
    .export-mode .pdf-no-break { page-break-inside: avoid; break-inside: avoid; }
    .export-mode .pdf-page-break-before { page-break-before: always; break-before: page; }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen antialiased">
  <div id="nav-root"></div>
  <main class="ml-0 lg:ml-[260px] min-h-screen">
    <div id="export-content" class="max-w-[1280px] mx-auto px-6 py-8 pt-14 lg:pt-8">
      <!-- Content rendered by JS -->
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('export-content');
      const month = DATA.currentMonth;
      const summary = month.summary;
      const computed = month.computed;

      const displayName = (m) => m.note ? m.short + ' *' : m.short;

      // Projects breadth data
      const projectsData = month.activeMembers.map(m => ({
        name: displayName(m),
        value: m.projects,
        color: m.color,
        displayValue: `${m.projects} projects`,
      })).sort((a, b) => b.value - a.value);

      // Token efficiency data
      const efficiencyData = computed.tokenEfficiency.map(e => {
        const member = month.activeMembers.find(m => m.id === e.id);
        return { name: member?.note ? e.name + ' *' : e.name,
        value: e.ratio,
        color: e.color,
        value: e.ratio, color: e.color, displayValue: `${e.ratio.toFixed(2)}x`,
      }; });

      container.innerHTML = `
        ${Theme.pageHeader('Adoption Metrics', 'Team engagement and usage patterns')}

        <!-- Stat Cards -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
          ${Theme.statCard('Team Adoption Rate', Theme.formatPercent(computed.teamAdoptionRate), summary.totalActiveDays + ' active days across team')}
          ${Theme.statCard('Avg Active Days', Math.round(summary.avgActiveDays) + ' days', 'Per person in ' + month.label)}
        </div>

        <!-- Individual Adoption Progress Bars -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 mb-6">
          <h2 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">Individual Adoption Rates</h2>
          <p class="text-xs text-slate-500 mb-6">Based on ${month.workingDays} working days in ${month.label}</p>
          <div class="space-y-6">
            ${computed.adoptionRates.map(a => {
              const member = month.activeMembers.find(m => m.id === a.id);
              return Charts.progressBar(a.activeDays, month.workingDays, member.color, displayName(member));
            }).join('')}
          </div>
        </div>

        <!-- Projects Breadth -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 mb-6">
          <h2 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">Projects Breadth</h2>
          <p class="text-xs text-slate-500 mb-4">Number of unique projects per team member</p>
          <div class="space-y-1">
            ${Charts.horizontalBar(projectsData, Math.max(...projectsData.map(p => p.value)))}
          </div>
        </div>

        <!-- Token Efficiency -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 mb-6">
          <h2 class="text-sm font-semibold text-slate-100 mb-6 uppercase tracking-wider">Token Efficiency</h2>
          <p class="text-xs text-slate-500 mb-4">Output tokens / Input tokens ratio — higher means more generated content</p>
          <div class="space-y-1">
            ${Charts.horizontalBar(efficiencyData, Math.max(...efficiencyData.map(e => e.value)))}
          </div>
        </div>

        ${month.pendingMembers.length > 0 ? `
          <!-- Pending Members Note -->
          <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-4">
            <div class="flex items-start gap-3">
              <svg class="w-5 h-5 text-yellow-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <div>
                <p class="text-sm font-medium text-yellow-300">Pending Reports</p>
                <p class="text-xs text-yellow-400/80 mt-1">Usage data not yet available for: ${month.pendingMembers.map(m => m.short).join(', ')}</p>
              </div>
            </div>
          </div>
        ` : ''}
      `;
    });
  </script>
</body>
</html>
