<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Overview — Claude AI Usage Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script>window.CURRENT_PAGE = 'team';</script>
  <script src="nav.js"></script>
  <script src="charts.js"></script>
  <script src="export.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .export-mode #nav-root { display: none !important; }
    .export-mode main { margin-left: 0 !important; }
    .export-mode [data-hide-pdf] { display: none !important; }
    .export-mode [data-show-pdf] { display: flex !important; }
    .export-mode .pdf-no-break { page-break-inside: avoid; break-inside: avoid; }
    .export-mode .pdf-page-break-before { page-break-before: always; break-before: page; }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen antialiased">
  <div id="nav-root"></div>
  <main class="ml-0 lg:ml-[260px] min-h-screen">
    <div id="export-content" class="max-w-[1280px] mx-auto px-6 py-8 pt-14 lg:pt-8">
      <!-- Content rendered by JS -->
    </div>
  </main>

  <script>
    let currentSort = 'cost';

    function renderTeamOverview() {
      const container = document.getElementById('export-content');
      const month = DATA.currentMonth;

      // Get sorted members
      let sortedMembers = [...month.activeMembers];
      switch(currentSort) {
        case 'tokens':
          sortedMembers.sort((a, b) => b.totalTokens - a.totalTokens);
          break;
        case 'days':
          sortedMembers.sort((a, b) => b.activeDays - a.activeDays);
          break;
        case 'efficiency':
          sortedMembers.sort((a, b) => {
            const aEff = a.activeDays > 0 ? a.totalCost / a.activeDays : 0;
            const bEff = b.activeDays > 0 ? b.totalCost / b.activeDays : 0;
            return bEff - aEff;
          });
          break;
        default: // cost
          sortedMembers.sort((a, b) => b.totalCost - a.totalCost);
      }

      container.innerHTML = `
        ${Theme.pageHeader('Team Overview', 'Compare usage across all team members')}

        <!-- Sort Controls -->
        <div class="flex items-center gap-2 mb-6 overflow-x-auto pb-2">
          <span class="text-xs text-slate-500 uppercase tracking-wider mr-2">Sort by:</span>
          ${['cost', 'tokens', 'days', 'efficiency'].map(sort => `
            <button onclick="currentSort='${sort}';renderTeamOverview()"
              class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors ${currentSort === sort ? 'bg-slate-700 text-slate-100 border border-slate-600' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800 hover:text-slate-300'}">
              ${sort === 'cost' ? 'Cost' : sort === 'tokens' ? 'Tokens' : sort === 'days' ? 'Active Days' : 'Efficiency'}
            </button>
          `).join('')}
        </div>

        <!-- Member Cards -->
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-8">
          ${sortedMembers.map(m => {
            const costPerDay = m.activeDays > 0 ? m.totalCost / m.activeDays : 0;
            const adoptionRate = (m.activeDays / month.workingDays) * 100;

            return `
              <div class="bg-slate-900 border border-slate-800 rounded-lg p-5 hover:border-slate-700 transition-colors">
                <!-- Header -->
                <div class="flex items-start justify-between mb-4">
                  <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-semibold text-sm" style="background:${m.color}">
                      ${Theme.initials(m.name)}
                    </div>
                    <div>
                      <h3 class="text-sm font-semibold text-slate-100">${Theme.escapeHtml(m.name)}${m.note ? ' <span class="text-amber-400">*</span>' : ''}</h3>
                      <p class="text-xs text-slate-500">${Theme.escapeHtml(m.role)}</p>
                    </div>
                  </div>
                  ${m.pdfFile ? `
                    <a href="${m.pdfFile}" target="_blank" class="text-xs text-slate-400 hover:text-slate-300 flex items-center gap-1">
                      <span>View Full Report</span>
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                      </svg>
                    </a>
                  ` : ''}
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-3 gap-3 mb-4">
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Cost</p>
                    <p class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatCost(m.totalCost)}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Tokens</p>
                    <p class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatTokens(m.totalTokens)}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Projects</p>
                    <p class="text-sm font-semibold text-slate-100 font-mono">${m.projects}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Active Days</p>
                    <p class="text-sm font-semibold text-slate-100 font-mono">${m.activeDays}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Cost/Day</p>
                    <p class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatCost(costPerDay)}</p>
                  </div>
                  <div>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider">Adoption</p>
                    <p class="text-sm font-semibold text-slate-100 font-mono">${Theme.formatPercent(adoptionRate)}</p>
                  </div>
                </div>

                <!-- Token Bar -->
                ${Charts.tokenBar(m.inputTokens, m.outputTokens, m.totalTokens)}

                ${m.note ? `
                  <div class="flex items-start gap-2 mt-3 p-2 bg-amber-500/10 border border-amber-500/20 rounded">
                    <svg class="w-3.5 h-3.5 text-amber-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-[10px] text-amber-300">${Theme.escapeHtml(m.note)}</p>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <!-- Comparison Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead>
                <tr class="border-b border-slate-800">
                  <th class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Name</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Cost</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Tokens</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Projects</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Active Days</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Cost/Day</th>
                  <th class="text-right text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3">Adoption</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                ${sortedMembers.map(m => {
                  const costPerDay = m.activeDays > 0 ? m.totalCost / m.activeDays : 0;
                  const adoptionRate = (m.activeDays / month.workingDays) * 100;

                  return `
                    <tr class="hover:bg-slate-800/50 transition-colors">
                      <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                          <span class="w-2 h-2 rounded-full" style="background:${m.color}"></span>
                          <span class="text-sm text-slate-300">${Theme.escapeHtml(m.short)}</span>
                          ${m.note ? '<span class="text-amber-400 font-bold" title="' + Theme.escapeHtml(m.note) + '">*</span>' : ''}
                        </div>
                      </td>
                      <td class="px-4 py-3 text-right text-sm font-mono text-slate-300">${Theme.formatCost(m.totalCost)}</td>
                      <td class="px-4 py-3 text-right text-sm font-mono text-slate-300">${Theme.formatTokens(m.totalTokens)}</td>
                      <td class="px-4 py-3 text-right text-sm font-mono text-slate-300">${m.projects}</td>
                      <td class="px-4 py-3 text-right text-sm font-mono text-slate-300">${m.activeDays}</td>
                      <td class="px-4 py-3 text-right text-sm font-mono text-slate-300">${Theme.formatCost(costPerDay)}</td>
                      <td class="px-4 py-3 text-right text-sm font-mono text-slate-300">${Theme.formatPercent(adoptionRate)}</td>
                    </tr>
                  `;
                }).join('')}
                ${month.pendingMembers.length > 0 ? `
                  <tr>
                    <td colspan="7" class="px-4 py-4 border-t border-slate-700">
                      <div class="flex items-center gap-2 text-xs text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>Pending reports: ${month.pendingMembers.map(m => m.short).join(', ')}</span>
                      </div>
                    </td>
                  </tr>
                ` : ''}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderTeamOverview);
  </script>
</body>
</html>
